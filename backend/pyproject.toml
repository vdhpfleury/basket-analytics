[project]
name = "basket-analytics-backend"
version = "0.1.0"
description = "Backend d'analyse vidéo de matchs de basket (basket-analytics)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "ultralytics>=8.3",
    "scipy>=1.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.7",
    "black>=24.0",
]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
